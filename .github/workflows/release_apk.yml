name: Build and Release SkyDrift APK

permissions:
  contents: write

on:
  workflow_dispatch: # Allows 1-click manual test runs from GitHub
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --flavor prod -t lib/main_prod.dart

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skydrift-release.apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/app/outputs/flutter-apk/app-prod-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
