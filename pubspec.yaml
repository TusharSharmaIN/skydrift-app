name: skydrift
description: "SkyDrift — mindfulness sky-gazing companion for Touch Grass."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Codegen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Functional
  dartz: ^0.10.1

  # DI
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Routing
  go_router: ^17.1.0

  # Network
  dio: ^5.9.1
  retrofit: ^4.4.2

  # Logging / inspector
  pretty_dio_logger: ^1.4.0
  chucker_flutter: ^1.9.1

  # UI
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3

  # Capture
  image_picker: ^1.1.2
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  freezed: 4.0.1
  json_serializable: ^6.13.0
  build_runner: ^2.11.1
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.2.3
  go_router_builder: ^4.2.0

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  rename: ^3.1.0
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F766E"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0F766E"
    image: assets/images/splash_logo.png
  ios: true
  android: true
